<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PXL — Offline Design Preview</title>
<link rel="stylesheet" href="./app/globals.css" />
<style>
.preview-banner{background:#203951;color:#bbd7f1;padding:10px 20px;text-align:center;font:11px var(--body);letter-spacing:.5px;border-bottom:1px solid #4c6480}.preview-banner strong{color:#fff}.preview-banner a{color:#d8e9ff;text-decoration:underline}
.preview-back{display:none}.demo-phone{position:fixed;inset:0;background:#0e1621;z-index:50}.demo-phone .chat-page{height:100svh}.demo-phone .chat-phone{height:min(800px,calc(100svh - 125px))}
@media(max-width:650px){.demo-phone .chat-phone{height:100svh}}
</style>
</head>
<body>
<div id="wall">
  <div class="preview-banner"><strong>OFFLINE DESIGN PREVIEW</strong> — sample characters only · no login, database, or realtime functionality. Open the actual app after setup.</div>
  <main class="app-shell">
    <header class="main-nav"><div class="brand-row"><div class="brand-emblem"><span>✦</span></div><div class="brand-title">PXL<span class="brand-point">.</span></div></div>
      <div class="nav-actions"><span class="nav-you"><strong>ME</strong></span><button class="icon-action" type="button" title="Preview only" aria-label="Preview only">✦</button></div>
    </header>
    <section class="collection-content">
      <div class="roster-grid" id="roster"></div>
    </section>
  </main>
</div>
<div id="phone" class="demo-phone" hidden></div>
<script>
const people=[['ACE','#deba7b','#344f6a',true],['XY','#c9c1e2','#4f4469',true],['BO','#c1a4ad','#405c56',false],['J','#d6c38b','#594e49',true],['ZEN','#a3c6c8','#385276',true],['ME','#e5ada5','#594457',true],['K','#b5c2d4','#48577e',false],['AB','#c3b5d0','#5b5448',false]];
function coin(name,rim,bg,status){const id='p'+name;return `<div class="coin-wrap"><svg viewBox="0 0 170 170" role="img" aria-label="${name} pixel hero"><defs><linearGradient id="m${id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1cc"/><stop offset=".3" stop-color="${rim}"/><stop offset=".58" stop-color="#625b65"/><stop offset=".88" stop-color="${rim}"/><stop offset="1" stop-color="#fff4ce"/></linearGradient><radialGradient id="f${id}" cx=".35" cy=".2" r=".9"><stop stop-color="#718da5"/><stop offset="1" stop-color="${bg}"/></radialGradient><clipPath id="c${id}"><circle cx="85" cy="85" r="59"/></clipPath></defs><circle cx="85" cy="85" r="79" fill="#0c1520"/><circle cx="85" cy="85" r="76" fill="url(#m${id})"/><circle cx="85" cy="85" r="70" fill="none" stroke="#fff1df" stroke-opacity=".5"/><circle cx="85" cy="85" r="65" fill="#1a2834" stroke="${rim}" stroke-width="3"/><circle cx="85" cy="85" r="60" fill="url(#f${id})"/><g clip-path="url(#c${id})" shape-rendering="crispEdges"><g transform="translate(28 24) scale(2.8)"><rect x="10" y="28" width="25" height="4" fill="#1c2d3c"/><rect x="13" y="26" width="7" height="11" fill="#354258"/><rect x="24" y="26" width="7" height="11" fill="#354258"/><rect x="11" y="35" width="10" height="4" fill="#1a2631"/><rect x="24" y="35" width="10" height="4" fill="#1a2631"/><rect x="8" y="20" width="6" height="14" fill="#c89e7b"/><rect x="30" y="20" width="6" height="14" fill="#c89e7b"/><rect x="12" y="19" width="22" height="13" fill="${rim}"/><rect x="17" y="20" width="12" height="10" fill="${bg}"/><rect x="22" y="19" width="3" height="10" fill="#eddbb9"/><rect x="13" y="29" width="22" height="3" fill="#293e51"/><rect x="25" y="29" width="5" height="3" fill="#f5cf85"/><rect x="18" y="17" width="10" height="5" fill="#bc8369"/><rect x="13" y="7" width="19" height="12" fill="#ce9977"/><rect x="15" y="7" width="15" height="10" fill="#e5b48e"/><rect x="17" y="13" width="3" height="3" fill="#202d3a"/><rect x="26" y="13" width="3" height="3" fill="#202d3a"/><rect x="13" y="4" width="21" height="8" fill="#3c3546"/><rect x="16" y="4" width="10" height="2" fill="#7b5c66"/><rect x="12" y="9" width="4" height="7" fill="#3c3546"/><rect x="30" y="9" width="3" height="6" fill="#3c3546"/></g></g><circle cx="85" cy="85" r="61" fill="none" stroke="#202d3b" stroke-width="4"/><path d="M28 61 A60 60 0 0 1 68 28" stroke="#fff" stroke-opacity=".26" fill="none" stroke-width="2"/></svg><span class="coin-presence ${status?'active':'away'}"></span></div>`}
function renderRoster(){const grid=document.getElementById('roster');grid.innerHTML=people.map(([name,rim,bg,status],i)=>`<button class="character-slot ${name==='ME'?'character-self':status?'can-select':''}" ${name==='ME'?'disabled':''} data-name="${name}">${coin(name,rim,bg,status)}<div class="coin-name">${name}</div>${name==='ME'?'<span class="self-marker">YOU</span>':''}</button>`).join('');grid.querySelectorAll('button:not(:disabled)').forEach(b=>b.addEventListener('click',()=>{const person=people.find(x=>x[0]===b.dataset.name);if(person[3])openDemo(b.dataset.name);else notifyAway(b.dataset.name)}))}
function notifyAway(name){const old=document.querySelector('.game-toast');if(old)old.remove();const toast=document.createElement('div');toast.className='game-toast';toast.role='status';toast.innerHTML='<span class="game-toast-dot"></span>'+name+' isn\'t around right now.';document.body.appendChild(toast);setTimeout(()=>toast.remove(),2400)}
function openDemo(name){const p=people.find(v=>v[0]===name),el=document.getElementById('phone');el.hidden=false;el.innerHTML=`<main class="chat-page"><header class="chat-desktop-header"><button class="chat-return" onclick="closeDemo()">← &nbsp; BACK TO PXL</button><div class="chat-top-brand">PXL <span>✦</span></div></header><div class="chat-stage"><div class="chat-phone"><header class="phone-header"><button class="phone-back" onclick="closeDemo()">←</button><div class="phone-avatar">${coin(p[0],p[1],p[2])}</div><div class="phone-peer"><strong>${name}</strong><span>Preview conversation</span></div><span class="header-presence green"></span></header><div class="phone-chat-history"><div class="chat-placeholder"><div class="chat-placeholder-coin">${coin(p[0],p[1],p[2])}</div><h2>${name}</h2><p>Say hello.</p><div class="sparkle-line">✦ ✧ ✦</div></div></div><div class="chat-compose-zone"><form class="compose-row" onsubmit="event.preventDefault()"><button type="button" class="compose-attach" disabled title="Live app supports photos">▣</button><input placeholder="Preview only" disabled><button type="button" class="compose-mic" disabled title="Live app supports voice">●</button></form></div></div></div></main>`;}
function closeDemo(){const el=document.getElementById('phone');el.hidden=true;el.innerHTML='';}
renderRoster();
</script>
</body>
</html>
